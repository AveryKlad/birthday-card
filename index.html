<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Открытка для сестры</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="book">
    <div class="page active">
      <h1>С днём рождения!</h1>
      <p>Листай дальше →</p>
    </div>
    <div class="page">
      <h2>Первый класс</h2>
      <p>Как мама отдавала тебя в школу...</p>
    </div>
    <div class="page">
      <h2>Люся и Ника</h2>
      <p>Чёрная кошка Люся и немецкая овчарка Ника...</p>
    </div>
    <div class="page">
      <h2>Моменты из жизни</h2>
      <p>Тёплые воспоминания...</p>
    </div>
    <div class="page">
      <h2>Мы все тебя любим</h2>
      <p>С любовью, твоя семья</p>
    </div>
  </div>

  <div class="controls">
    <button id="prev">←</button>
    <button id="next">→</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
